<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="facebook-domain-verification" content="kjhiqtzh9evs5a8xvoru9af90ps7b9" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D2348">
<meta name="robots" content="noindex">
<title>Луна: личный астролог</title>
<script>
// Сразу в бота. Метка из ссылки (?start=igt_1) уходит в бот как есть, без метки — lp_site.
(function () {
  var raw = new URLSearchParams(location.search).get('start') || '';
  var code = /^[A-Za-z0-9_-]{1,64}$/.test(raw) ? raw : 'lp_site';
  var url = 'https://t.me/AstroLunaai_bot?start=' + encodeURIComponent(code);
  window.__bot = url;
  location.replace(url);
})();
</script>
<style>
:root{--bg:#3D2348;--fg:#F6EEF6;--muted:#CDBBD2;--tg:#2AABEE}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:grid;gap:14px;justify-items:center;text-align:center;max-width:22rem}
.moon{font-size:40px;line-height:1}
h1{margin:0;font-size:20px;font-weight:600}
p{margin:0;color:var(--muted)}
a.btn{display:block;width:100%;padding:16px 20px;border-radius:14px;background:var(--tg);color:#fff;text-decoration:none;font-weight:600;font-size:17px}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="moon" aria-hidden="true">☾</div>
<h1>Открываем Луну в Telegram…</h1>
<a class="btn" id="go" href="https://t.me/AstroLunaai_bot?start=lp_site">Открыть в Telegram</a>
<p>Если Telegram не открылся, найди там <b>@AstroLunaai_bot</b></p>
</main>
<script>document.getElementById('go').href = window.__bot || document.getElementById('go').href;</script>
</body>
</html>
